plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ayazmirza.remotemic'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ayazmirza.remotemic'
        minSdk 28          // BluetoothHidDevice (phone-as-keyboard) needs Android 9+
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No library dependencies on purpose: plain Android framework only.
