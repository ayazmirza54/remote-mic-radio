# Builds both apps on GitHub's machines. Push this folder to a GitHub repo, open the
# "Actions" tab, and download the artifacts. Push a tag like v1.0 to get a Release page
# you can open from your phone to install the APK directly.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    name: Android APK (Bluetooth remote)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RemoteMic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteMic-android
          path: RemoteMic.apk

  windows:
    name: Windows agent .exe (Wi-Fi, full control)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build RemoteMic.exe
        run: >
          pyinstaller --onefile --noconsole --name RemoteMic
          --icon static/icon.ico
          --add-data "static;static"
          --hidden-import qrcode.image.svg
          server.py
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteMic-windows
          path: dist/RemoteMic.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            RemoteMic-android/RemoteMic.apk
            RemoteMic-windows/RemoteMic.exe
